<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Pokerbirdy 原型 · 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;}
html,body{height:100%;background:#F5F5F5;color:#111;font-size:13px;}
.app{display:grid;grid-template-columns:280px 1fr 380px;height:100vh;transition:grid-template-columns .25s;}
.app.prd-collapsed{grid-template-columns:280px 1fr 0;}
.nav{background:#FFFFFF;border-right:1px solid #EEEEEE;display:flex;flex-direction:column;min-height:0;}
.nav-head{padding:18px 20px 14px;border-bottom:1px solid #EEEEEE;}
.nav-head .ttl{font-size:16px;font-weight:700;}
.nav-head .sub{font-size:11px;color:#999;margin-top:3px;}
.nav-search{padding:10px 14px;border-bottom:1px solid #EEEEEE;}
.nav-search input{width:100%;height:32px;border:1px solid #EEEEEE;border-radius:6px;padding:0 10px;font-size:12px;outline:none;background:#FAFAFA;}
.nav-list{flex:1 1 0;overflow-y:auto;overflow-x:hidden;padding:6px 0;min-height:0;}
.nav-list::-webkit-scrollbar{width:6px;}
.nav-list::-webkit-scrollbar-thumb{background:#CCCCCC;border-radius:3px;}
.grp{padding:8px 0;}
.grp-ttl{padding:8px 20px 4px;font-size:10px;color:#999;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.item{display:flex;align-items:center;padding:6px 20px;font-size:12px;color:#333;cursor:pointer;border-left:3px solid transparent;}
.item:hover{background:#F5F5F5;}
.item.cur{background:#F5F5F5;border-left-color:#111;color:#111;font-weight:600;}
.item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .tag{margin-left:6px;font-size:9px;padding:1px 5px;border:1px solid #CCC;border-radius:999px;color:#666;}
.item.placeholder .tag{background:#111;color:#fff;border-color:#111;}

.preview-area{display:flex;flex-direction:column;min-width:0;min-height:0;}
.preview-bar{padding:10px 20px;background:#FFFFFF;border-bottom:1px solid #EEEEEE;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.preview-bar .crumb{font-size:13px;color:#666;}
.preview-bar .crumb b{color:#111;}
.preview-bar .right{margin-left:auto;display:flex;gap:6px;align-items:center;}
.preview-bar .right button{padding:6px 12px;font-size:11px;border:1px solid #EEEEEE;border-radius:6px;background:#FFFFFF;cursor:pointer;color:#666;}
.preview-bar .right button.cur{background:#111;color:#FFF;border-color:#111;}
.preview-wrap{flex:1;background:#F5F5F5;overflow:auto;min-height:0;}
.preview-frame{width:100%;height:100%;border:0;background:#FFF;display:block;}

.prd{background:#FFFFFF;border-left:1px solid #EEEEEE;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.app.prd-collapsed .prd{display:none;}
.prd-head{padding:14px 20px;border-bottom:1px solid #EEEEEE;display:flex;align-items:center;gap:8px;}
.prd-head h2{font-size:14px;font-weight:700;white-space:nowrap;}
.prd-tools{margin-left:auto;display:flex;align-items:center;gap:6px;}
.prd-btn{padding:4px 10px;font-size:11px;border:1px solid #CCCCCC;border-radius:6px;background:#FFFFFF;color:#333333;cursor:pointer;line-height:1.4;white-space:nowrap;}
.prd-btn:hover{background:#F5F5F5;}
.prd-btn-primary{background:#111111;color:#FFFFFF;border-color:#111111;}
.prd-edited{font-size:10px;color:#999999;border:1px solid #EEEEEE;border-radius:999px;padding:1px 7px;white-space:nowrap;}
.prd-head .close{cursor:pointer;color:#666666;font-size:16px;}
#prdBody[contenteditable="true"]{background:#FFFDF0;outline:2px solid #111111;outline-offset:-3px;border-radius:4px;}
.prd-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111111;color:#FFFFFF;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80vw;text-align:center;}
.prd-toast.show{opacity:1;}
.prd-body{flex:1 1 0;overflow-y:auto;padding:14px 20px 30px;font-size:12px;line-height:1.7;color:#333;min-height:0;}
.prd-body::-webkit-scrollbar{width:6px;}
.prd-body::-webkit-scrollbar-thumb{background:#CCC;border-radius:3px;}
.prd-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.prd-meta span{padding:2px 8px;border-radius:999px;font-size:10px;background:#F5F5F5;color:#666;}
.prd-meta .key{background:#111;color:#FFF;}
.prd-blk{margin-bottom:14px;}
.prd-blk h3{font-size:10px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.prd-blk p,.prd-blk li{font-size:12px;color:#333;line-height:1.7;}
.prd-blk ul{padding-left:14px;list-style:disc;}
.prd-blk ul li{margin-bottom:3px;}
.prd-blk dl{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;}
.prd-blk dt{color:#999;font-size:11px;}
.prd-blk dd{font-size:12px;color:#333;line-height:1.6;}
.no-prd{color:#999;padding:20px 0;text-align:center;font-size:12px;}
.show-prd{display:none;}
.app.prd-collapsed .show-prd{display:inline-flex;}
.show-prd{padding:6px 12px;font-size:11px;border:1px solid #111;border-radius:6px;background:#111;color:#FFF;cursor:pointer;}
</style>
</head>

px;}\n.post-time::before{content:\"·\";margin:0 4px;}\n.post-tag-row{margin-top:4px;}\n.tag-mute{display:inline-block;padding:2px 10px;font-size:11px;border-radius:999px;background:#F5F5F5;color:#666666;line-height:1.5;}\n.tag-line{display:inline-block;padding:2px 8px;font-size:11px;border:1px solid #EEEEEE;border-radius:999px;color:#666666;background:#FFFFFF;line-height:1.6;}\n.tag-status{display:inline-block;padding:2px 10px;font-size:11px;border-radius:999px;background:#111111;color:#FFFFFF;line-height:1.6;font-weight:500;}\n.post-body{margin:8px 0;font-size:14px;color:#111111;line-height:1.6;}\n.hand-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #EEEEEE;border-radius:10px;margin:8px 0;overflow:hidden;background:#FFFFFF;}\n.hand-hero-cell{padding:10px 14px;border-right:1px solid #EEEEEE;}\n.hand-hero-cell:last-child{border-right:0;}\n.hand-hero-cell .lbl{font-size:11px;color:#666666;margin-bottom:4px;}\n.hand-hero-cell .val{font-size:14px;font-weight:600;font-family:ui-monospace,Menlo,monospace;color:#111111;}\n.hand-fold{margin-top:8px;padding:11px 14px;font-size:13px;color:#666666;background:#F5F5F5;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}\n.hand-fold-open{background:#111111;color:#FFFFFF;}\n.hand-full{border:1px solid #EEEEEE;border-radius:10px;margin-top:8px;padding:12px 16px;}\n.hand-stage{padding:6px 0;font-size:13px;font-family:ui-monospace,Menlo,monospace;color:#333333;}\n.hand-stage b{color:#111111;font-weight:700;margin-right:8px;display:inline-block;min-width:60px;}\n.placeholder{background:repeating-linear-gradient(135deg,#FAFAFA,#FAFAFA 8px,#EEEEEE 8px,#EEEEEE 9px);border:1px solid #EEEEEE;display:flex;align-items:center;justify-content:center;color:#999999;font-size:13px;border-radius:8px;}\n.ph-img{width:100%;height:300px;margin-top:8px;border-radius:10px;}\n.ph-voice{height:48px;margin-top:8px;border-radius:8px;}\n.ph-cover{width:100%;border-radius:8px;}\n.post -items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:9999px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2;border:0;}\n.btn-primary{background:#111111;color:#FFFFFF;}\n.btn-secondary{background:#FFFFFF;border:1px solid #CCCCCC;color:#111111;}\n.btn-ghost{background:#F5F5F5;color:#111111;}\n.btn-text{background:transparent;color:#666666;padding:8px 8px;}\n.btn-sm{padding:6px 14px;font-size:12px;}\n.btn-lg{padding:12px 24px;font-size:15px;}\n.btn-block{width:100%;}\n.alert{padding:10px 14px;border:1px solid #EEEEEE;border-radius:8px;background:#F5F5F5;display:flex;gap:10px;align-items:center;font-size:13px;color:#333333;}\n.alert-strong{border-left:3px solid #111111;background:#FFFFFF;}\n.card{background:#FFFFFF;border:1px solid #EEEEEE;border-radius:12px;padding:16px 20px;}\n.section-title{font-size:18px;font-weight:700;margin:24px 0 12px;}\n.stat-grid{display:grid;gap:12px;}\n.stat-grid.c4{grid-template-columns:repeat(4,1fr);}\n.stat-grid.c3{grid-template-columns:repeat(3,1fr);}\n.stat-grid.c2{grid-template-columns:repeat(2,1fr);}\n.stat-card{padding:14px 16px;border:1px solid #EEEEEE;border-radius:10px;background:#FFFFFF;}\n.stat-card .lbl{font-size:12px;color:#666666;}\n.stat-card .val{font-size:22px;font-weight:700;margin-top:2px;line-height:1.3;}\n.stat-card .delta{font-size:11px;color:#666666;margin-top:2px;}\n.muted{color:#666666;font-size:12px;}\n.divider{border-top:1px solid #EEEEEE;margin:16px 0;}\n\n/* 旅程卡片 (横向) */\n.journey-card{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #EEEEEE;cursor:pointer;}\n.journey-card .jc-cover{width:140px;height:100px;flex-shrink:0;border-radius:8px;}\n.journey-card .jc-body{flex:1;min-width:0;}\n.journey-card .jc-title{font-size:15px;font-weight:700;color:#111111;margin-bottom:6px;}\n.journey-card .jc-tags{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}\n.journey-card .jc-meta{font-size:12px;color:#666666;margin-bottom:6px;}\n.journey-card .jc-la function group(){
  const g = {};
  for (const p of PAGES) { if (!g[p.mod]) g[p.mod]=[]; g[p.mod].push(p); }
  return g;
}
function renderNav(filter=''){
  const g = group();
  const f = filter.trim().toLowerCase();
  const html = Object.entries(g).map(([mod, items]) => {
    const visible = items.filter(p => !f || p.name.toLowerCase().includes(f));
    if (!visible.length) return '';
    return '<div class="grp"><div class="grp-ttl">'+mod+' · '+visible.length+'</div>' +
      visible.map(p => '<div class="item'+(p.placeholder?' placeholder':'')+'" data-i="'+p.i+'"><span class="name">'+p.name+'</span>'+(p.placeholder?'<span class="tag">补</span>':'')+'</div>').join('') +
      '</div>';
  }).join('');
  document.getElementById('navList').innerHTML = html;
}

let CUR_PRD = null;
const PRD_KEY = i => 'psprd_' + i;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

function getStore(){ try{ return JSON.parse(document.getElementById('prdStore').textContent||'{}'); }catch(e){ return {}; } }
function setStore(s){ var el=document.getElementById('prdStore'); if(el) el.textContent=JSON.stringify(s).replace(/<\//g,'<\\/'); }
function collectStore(){
  var s=getStore();
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('psprd_')===0) s[k.slice(6)]=localStorage.getItem(k); } }catch(e){}
  return s;
}
function fileName(){ try{ return decodeURIComponent(location.pathname.split('/').pop()||'prototype.html'); }catch(e){ return 'prototype.html'; } }
function toast(msg){ var t=document.getElementById('prdToast'); if(!t){ return; } t.textContent=msg; t.classList.add('show'); clearTimeout(window.__tt); window.__tt=setTimeout(function(){t.classList.remove('show');},2800); }
function buildFileText(){
  setStore(collectStore());
  var frame=document.getElementById('frame'), nav=document.getElementById('navList'), body=document.getElementById('prdBody');
  var sF=frame?frame.getAttribute('srcdoc'):null, sN=nav?nav.innerHTML:null, sB=body?body.innerHTML:null, sE=body?body.getAttribute('contenteditable'):null;
  if(frame) frame.setAttribute('srcdoc','');
  if(nav) nav.innerHTML='';
  if(body){ body.innerHTML=''; body.setAttribute('contenteditable','false'); }
  var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  if(frame) frame.setAttribute('srcdoc',sF);
  if(nav) nav.innerHTML=sN;
  if(body){ body.innerHTML=sB; body.setAttribute('contenteditable',sE||'false'); }
  return html;
}
var __fh=null;
async function writeFile(){
  var text=buildFileText();
  // 1) 本地服务（http/localhost）直写原文件——零弹窗、无需重复操作
  if(location.protocol==='http:'||location.protocol==='https:'){
    try{
      var resp=await fetch('/__save__',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:location.pathname,html:text})});
      if(resp&&resp.ok) return 'server';
    }catch(e){}
  }
  // 2) file:// → File System Access（首次选一次，本会话后续直写）
  if(window.showSaveFilePicker){
    try{
      if(!__fh){ __fh=await window.showSaveFilePicker({suggestedName:fileName(),types:[{description:'HTML 文件',accept:{'text/html':['.html']}}]}); }
      var w=await __fh.createWritable(); await w.write(text); await w.close();
      return 'file';
    }catch(e){ if(e&&e.name==='AbortError') return 'cancel'; }
  }
  try{
    var blob=new Blob([text],{type:'text/html'}); var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=fileName(); document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    return 'download';
  }catch(e){ return 'fail'; }
}

function buildPrdHtml(p){
  if (!p.prd) return '<div class="no-prd">该页面暂无 PRD 注释</div>';
  const d = p.prd;
  const list = (arr) => '<ul>'+(arr||[]).map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  const role = (d.role||[]).join(' · ');
  return '<div class="prd-meta">' +
    '<span class="key">'+p.name+'</span>' +
    '<span>模块: '+d.m+'</span>' +
    (role?'<span>角色: '+role+'</span>':'') +
    '</div>' +
    (d.goal?'<div class="prd-blk"><h3>页面目标</h3><p>'+d.goal+'</p></div>':'') +
    (d.struct?'<div class="prd-blk"><h3>页面结构</h3>'+list(d.struct)+'</div>':'') +
    (d.inter?'<div class="prd-blk"><h3>关键交互</h3>'+list(d.inter)+'</div>':'') +
    (d.state?'<div class="prd-blk"><h3>状态覆盖</h3>'+list(d.state)+'</div>':'') +
    (d.rule?'<div class="prd-blk"><h3>业务规则</h3>'+list(d.rule)+'</div>':'') +
    (d.prd?'<div class="prd-blk"><h3>PRD 详细 (规范 §4 第四步)</h3>'+
       '<dl>' +
       (d.prd.pos?'<dt>业务定位</dt><dd>'+d.prd.pos+'</dd>':'') +
       (d.prd.task?'<dt>用户任务</dt><dd>'+d.prd.task+'</dd>':'') +
       (d.prd.field?'<dt>字段说明</dt><dd>'+d.prd.field+'</dd>':'') +
       (d.prd.comp?'<dt>组件交互</dt><dd>'+d.prd.comp+'</dd>':'') +
       (d.prd.state?'<dt>状态流转</dt><dd>'+d.prd.state+'</dd>':'') +
       (d.prd.deps?'<dt>上下游依赖</dt><dd>'+d.prd.deps+'</dd>':'') +
       '</dl></div>':'') +
    (d.todo?'<div class="prd-blk"><h3>待确认项</h3>'+list(d.todo)+'</div>':'') +
    (d.note?'<div class="prd-blk"><h3>备注</h3><p>'+d.note+'</p></div>':'');
}

function renderPrd(p){
  CUR_PRD = p.i;
  const body = document.getElementById('prdBody');
  const ls = lsGet(PRD_KEY(p.i));
  const st = getStore();
  const ov = (ls != null) ? ls : ((st[p.i] != null) ? st[p.i] : null);
  body.innerHTML = (ov != null) ? ov : buildPrdHtml(p);
  body.contentEditable = 'false';
  setPrdMode(false);
  document.getElementById('prdEdited').style.display = (ov != null) ? '' : 'none';
}

function setPrdMode(editing){
  document.getElementById('prdEditBtn').style.display = editing ? 'none' : '';
  document.getElementById('prdResetBtn').style.display = editing ? 'none' : '';
  document.getElementById('prdSaveBtn').style.display = editing ? '' : 'none';
  document.getElementById('prdCancelBtn').style.display = editing ? '' : 'none';
}

function prdEdit(){
  const body = document.getElementById('prdBody');
  body.contentEditable = 'true';
  setPrdMode(true);
  body.focus();
}

async function prdSave(){
  const body = document.getElementById('prdBody');
  const ok = lsSet(PRD_KEY(CUR_PRD), body.innerHTML);
  body.contentEditable = 'false';
  setPrdMode(false);
  document.getElementById('prdEdited').style.display = '';
  const r = await writeFile();
  if (r === 'server') toast('已直接写回原文件 ✓');
  else if (r === 'file') toast('已保存并写入 HTML 文件 ✓');
  else if (r === 'download') toast('浏览器未授予写权限，已导出更新后的 HTML，请覆盖原文件');
  else if (r === 'cancel') toast('已暂存到本地（未选择文件，磁盘文件未更新）');
  else toast(ok ? '已暂存到本地（写文件失败）' : '保存失败');
}

function prdCancel(){
  renderPrd(PAGES.find(x => x.i === CUR_PRD));
}

async function prdReset(){
  if (!confirm('重置将清除本页已保存的 PRD 编辑，恢复为原始内容，是否继续？')) return;
  lsDel(PRD_KEY(CUR_PRD));
  const st = getStore(); delete st[CUR_PRD]; setStore(st);
  renderPrd(PAGES.find(x => x.i === CUR_PRD));
  const r = await writeFile();
  if (r === 'server') toast('已重置并写回原文件 ✓');
  else if (r === 'file') toast('已重置并写入 HTML 文件 ✓');
  else if (r === 'download') toast('已导出重置后的 HTML，请覆盖原文件');
  else toast('已重置（磁盘文件未更新）');
}

function show(i){
  const p = PAGES.find(x => x.i === i);
  if (!p) return;
  document.getElementById('crumbMod').textContent = p.mod;
  document.getElementById('crumbName').textContent = p.name;
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('cur', +el.dataset.i === i));
  document.getElementById('frame').srcdoc = HTMLS[i];
  renderPrd(p);
}

function togglePrd(){
  document.getElementById('app').classList.toggle('prd-collapsed');
}

document.getElementById('navList').addEventListener('click', e => {
  const it = e.target.closest('.item');
  if (it) show(+it.dataset.i);
});
document.getElementById('search').addEventListener('input', e => renderNav(e.target.value));
document.querySelectorAll('.preview-bar .right button[data-zoom]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.preview-bar .right button[data-zoom]').forEach(x => x.classList.remove('cur'));
    b.classList.add('cur');
    const z = +b.dataset.zoom / 100;
    const f = document.getElementById('frame');
    f.style.transform = 'scale('+z+')'; f.style.transformOrigin = 'top left';
    f.style.width = (100/z)+'%'; f.style.height = (100/z)+'%';
  };
});

renderNav();
show(51);
</script>
</body>
</html>
